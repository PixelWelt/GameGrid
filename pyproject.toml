[project]
name = "GameGrid"
version = "1.4.2"
description = "A flask wrapper for your WebGL games"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "PixelWelt" }]
license = "MIT"
keywords = ["flask", "webgl", "arcade", "games"]

dependencies = [
  "uv==0.12.9",
  "blinker==1.9.0",
  "click==8.5.0",
  "colorama==0.4.6",
  "flask==3.1.3",
  "flask-cors==6.0.5",
  "itsdangerous==2.2.0",
  "Jinja2==3.1.6",
  "loguru==0.7.3",
  "MarkupSafe==3.0.3",
  "gunicorn==26.2.0",
  "PyYAML==6.0.3",
  "werkzeug==3.1.8",
  "win32_setctime==1.2.0",
]

[project.urls]
Repository = "https://github.com/PixelWelt/GameGrid"
